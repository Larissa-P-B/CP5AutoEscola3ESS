spring.application.name=AutoEscola3ESS
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autoescola3ess}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
api.security.token.secret=${JWT_SECRET}
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.viacep.base-url=${VIACEP_BASE_URL:https://viacep.com.br/ws}
app.viacep.connect-timeout-ms=3000
app.viacep.read-timeout-ms=5000
